[package]
name = "litescriptmanager"
version = "0.1.0"
description = "LiteScriptManager"
authors = ["LiteScriptManager"]
edition = "2024"

[lib]
name = "litescriptmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
glob = "0.3"
regex = "1"
wait-timeout = "0.2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "fs", "macros", "rt-multi-thread"] }
chrono = "0.4"
chrono-tz = "0.10"
encoding_rs = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Wdk_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
