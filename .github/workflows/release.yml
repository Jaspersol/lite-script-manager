name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app_version" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run tauri build

      # The updater refuses to run an installer without a checksum: publish the
      # per-installer "<installer>.exe.sha256" (used by the primary GitHub API
      # check) and a SHA256SUMS.txt manifest (used by the no-API fallback check).
      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          $lines = foreach ($installer in $installers) {
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($installer.Name)" | Out-File -FilePath "$($installer.FullName).sha256" -Encoding ascii
            "$hash  $($installer.Name)"
          }
          # LF endings, no BOM: the fallback parser splits on \n, and a trailing
          # \r would stick to the installer name and break the .exe match.
          [System.IO.File]::WriteAllText(
            'src-tauri/target/release/bundle/nsis/SHA256SUMS.txt',
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false))

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sha256
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          generate_release_notes: true
